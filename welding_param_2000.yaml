description: |
  For 2-point welding with swing, large-piece T-shape head up. Pin should be outward (electric mouth) by 13mm. [Megmeet] 142A 17.6V 
weld_length: 900.0
weld_speed: 1.5
safe_height: 50.0
RTOL: True
actions_offset: [0, 0]
actions:
  - [0.0, 0.0, 0, 1.5] #1
  - [0, -3.5, -10, 3.0] #2
  - [4.0, 0.0, 0, 1.4] #3
  - [0, -8, 0, 3.0] #4
  - [4, -4, 0, 3] #5
  - [9, 0, 0, 1.4] #6
  - [0, -14, -10, 3] #7
  - [4, -11, 0, 3] #8
  - [8, -7, 0, 3] #9
  - [12, -3, 0, 3] #10
  - [17, -1, 0, 1.4] #11
actions_param:
  # break_points: [[80, 100], [200, 220]]
  swing_list:
    - period: 1.5 #1
      hold_times: [0.5, 0.5]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, 4]
    - period: 1.5 #2
      hold_times: [0.01, 0.5]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, -5]
    - period: 3.2 #3
      hold_times: [0.5, 0., 0, 0.]
      first_stroke_rel_offset: [5, 0]
      second_stroke_rel_offset: [0, -4]
    - period: 1.5 #4
      hold_times: [0.01, 0.5]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, -5]
    - period: 1 #5
      hold_times: [0.01, 0.01]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, -5]
    - period: 3 #6
      hold_times: [0.5, 0., 0, 0.]
      first_stroke_rel_offset: [5, 0]
      second_stroke_rel_offset: [0, -4]
    - period: 1.5 #7
      hold_times: [0.01, 0.5]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, -5]
    - period: 1 #8
      hold_times: [0.01, 0.01]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, -5]
    - period: 1 #9
      hold_times: [0.01, 0.01]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, -5]
    - period: 1 #10
      hold_times: [0.01, 0.01]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, -5]
    - period: 3 #11
      hold_times: [0.5, 0., 0, 0.]
      first_stroke_rel_offset: [5, 0]
      second_stroke_rel_offset: [0, -4]
executor_type: point_pairs